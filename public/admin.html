<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GİZLİ KONTROL PANELİ</title>
  <style>
    body { font-family: sans-serif; text-align: center; margin-top: 50px; background: #333; color: white; }
    button { display: block; width: 80%; padding: 20px; margin: 15px auto; font-size: 20px; cursor: pointer; background: #ff4757; color: white; border: none; border-radius: 10px;}
    button:active { background: #ff6b81; }
  </style>
</head>
<body>
  <h1>Şaka Kontrol Merkezi 😈</h1>
  <button onclick="komutGonder('titret')">1. Sayfayı Titret</button>
  <button onclick="komutGonder('titret_durdur')">Titremeyi Durdur</button>
  <button onclick="komutGonder('yazi_degistir')">2. Metni Değiştir (Troll)</button>
  <button onclick="komutGonder('karanlik_mod')">3. Siyah Ekran / Korkut</button>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    function komutGonder(komut) {
      socket.emit('admin_komutu', komut);
    }
  </script>
</body>
</html>
